<script>
const video=document.getElementById('animation'), success=document.getElementById('success'), retryLayer=document.getElementById('retryLayer'), retryButton=document.getElementById('retryButton');
let started=false;
// 在支持的 iOS Safari 中明确请求内嵌播放，避免进入系统全屏播放器。
function forceInline(){try{video.playsInline=true;}catch(e){}try{if(typeof video.webkitSetPresentationMode==='function')video.webkitSetPresentationMode('inline');}catch(e){}}
forceInline();
video.addEventListener('webkitbeginfullscreen',()=>{try{if(typeof video.webkitSetPresentationMode==='function')video.webkitSetPresentationMode('inline');}catch(e){}});
video.addEventListener('ended',()=>{success.classList.remove('hidden');});
video.addEventListener('error',()=>{retryLayer.classList.remove('hidden');});
video.addEventListener('playing',()=>{started=true;retryLayer.classList.add('hidden');});
function tryPlay(){forceInline();retryButton.disabled=true;retryButton.textContent='正在重试…';try{video.currentTime=0;}catch(e){}const attempt=video.play();if(attempt&&attempt.then){attempt.then(()=>{retryLayer.classList.add('hidden');}).catch(()=>{retryLayer.classList.remove('hidden');retryButton.disabled=false;retryButton.textContent='加载失败，点击重试';});}else{retryLayer.classList.add('hidden');retryButton.disabled=false;retryButton.textContent='加载失败，点击重试';}}
retryButton.addEventListener('click',tryPlay);
// 打开页面时先尝试带声音自动播放；失败后显示自定义重试按钮。
forceInline();video.play().then(()=>forceInline()).catch(()=>{retryLayer.classList.remove('hidden');});
